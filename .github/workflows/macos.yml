name: macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "Models/**"
      - "scripts/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          sysctl -n machdep.cpu.brand_string
      - name: Unit and end-to-end tests
        run: swift test
      - name: Build Chordify.app
        run: scripts/build_app.sh
      - name: Command-line analysis (release build)
        run: |
          build/Chordify.app/Contents/MacOS/Chordify --analyze legacy/2023-cs545-svm/sample_audio.wav --midi build/sample.mid
      - name: Link analysis (beta), local page and direct file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/site
          afconvert -f m4af -d aac legacy/2023-cs545-svm/sample_audio.wav build/site/song.m4a
          printf '<html><head><title>Chordify link test</title></head><body><audio controls src="song.m4a"></audio></body></html>' > build/site/index.html
          (cd build/site && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8765/index.html && break; sleep 1; done
          build/Chordify.app/Contents/MacOS/Chordify --analyze-url http://127.0.0.1:8765/index.html --nashville > build/link-page.txt
          head -40 build/link-page.txt
          build/Chordify.app/Contents/MacOS/Chordify --analyze-url http://127.0.0.1:8765/song.m4a > build/link-file.txt
          head -12 build/link-file.txt
      - name: YouTube link (informational, may be blocked on CI)
        continue-on-error: true
        shell: bash
        run: |
          build/Chordify.app/Contents/MacOS/Chordify --analyze-url "https://www.youtube.com/watch?v=jNQXAC9IVRw" > build/link-youtube.txt 2>&1 || true
          head -30 build/link-youtube.txt
      - name: Launch smoke test
        run: |
          build/Chordify.app/Contents/MacOS/Chordify &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then echo "app is running"; kill $PID; else echo "app exited early"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Chordify-macOS-arm64
          path: build/Chordify.zip
